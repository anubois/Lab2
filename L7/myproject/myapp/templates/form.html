<!DOCTYPE html>
<html>
<head>
    <title>Employee Form</title>

    <style>
        body{
            font-family: Arial;
            background:#e8e2e2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:10px;
            width:300px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
        }

        input, select{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
        }
    </style>

</head>

<body>

<div class="card">

<h2>บันทึกข้อมูลพนักงาน</h2>

<form>

<label>Full Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Position</label>
<select>
<option>Manager</option>
<option>Developer</option>
<option>Designer</option>
</select>

<label>Phone Number</label>
<input type="text">

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
