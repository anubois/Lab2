<!DOCTYPE html>
<html>
<head>
    <title>About</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:0;
            padding:0;
            text-align:center;
        }

        h1{
            margin-top:30px;
        }

        .gallery{
            width:80%;
            margin:auto;
            margin-top:30px;

            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
        }

        .gallery img{
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

    </style>

</head>

<body>

<h1>About Us</h1>

<div class="gallery">

    <img src="https://picsum.photos/400/300?1">
    <img src="https://picsum.photos/400/300?2">
    <img src="https://picsum.photos/400/300?3">

    <img src="https://picsum.photos/400/300?4">
    <img src="https://picsum.photos/400/300?5">
    <img src="https://picsum.photos/400/300?6">

</div>

</body>
</html>
