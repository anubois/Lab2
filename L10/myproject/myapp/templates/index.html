<!DOCTYPE html>
<html>
<head>
    <title>ตารางข้อมูล</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .btn-pink {
            background-color: hotpink;
            color: white;
        }

        .btn-orange {
            background-color: orange;
            color: white;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center">📊 ตารางข้อมูล</h2>

    <table class="table table-hover text-center">

        <thead class="table-dark">
            <tr>
                <th>ชื่อ</th>
                <th>รายละเอียด</th>
                <th>จัดการ</th>
            </tr>
        </thead>

        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.detail }}</td>
                <td class="text-center">

                    <a href="/edit/{{ item.id }}" class="btn btn-pink btn-sm">
                        Edit
                    </a>

                    <a href="/delete/{{ item.id }}" class="btn btn-orange btn-sm">
                        Delete
                    </a>

                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</div>

</body>
</html>
